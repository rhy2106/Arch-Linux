[module/playerctl]
type = custom/script
exec = playerctl metadata title 2> /dev/null
format = <label>
label-maxlen = 15

[module/playerctl-previous]
type = custom/script
exec = echo 󰒮
format = <label>
click-left = playerctl previous

[module/playerctl-play-pause]
type = custom/script
exec = [ "$(playerctl status 2> /dev/null)" = "Playing" ] && echo 󰐊|| echo 󰏤
format = <label>
click-left = playerctl play-pause

[module/playerctl-next]
type = custom/script
exec = echo 󰒭
format = <label>
click-left = playerctl next

[module/playerctl-shuffle]
type = custom/script
exec = [ "$(playerctl shuffle 2> /dev/null)" = "On" ] && echo  || echo 󰒞
format = <label>
click-left = playerctl shuffle Toggle

